<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Mobile games by Thendar, including Word Jungle, a colorful word-connect game for Android.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="/"><span>Thendar</span></a>

          <img src="/word-jungle/img/feature.jpg" width="1024" height="500" alt="">

              <p class="meta">Free on Android →</p>

    <div class="wrap">
      <p>Games by Thendar.</p>
